[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adbuart"
version = "0.1.1"
description = "Expose an Android device UART as a local PTY over adb."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "XuNeo" },
]
keywords = ["adb", "uart", "pty", "serial", "nuttx", "rtos"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Embedded Systems",
  "Topic :: System :: Hardware",
  "Topic :: Terminals :: Serial",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/XuNeo/adbuart"
Repository = "https://github.com/XuNeo/adbuart"
Issues = "https://github.com/XuNeo/adbuart/issues"

[project.scripts]
adbuart = "adbuart.cli:main"
